# The data, input and browser checks, on every push and pull request.
#
# Independent of the deploy: Vercel builds and publishes every push on its own,
# and these checks validate the baked world, model contracts, input and WebGL.
#
# Nothing here reads ../.cache: the checks run against what is committed under
# public/, which is what ships. The bakes are not run — their sources are not
# in the repository; see scripts/sources.json.
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      # And Node from `engines.node`: 22.18 is the first with type stripping on
      # by default, which is how every .ts script here runs.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      # `allowBuilds: esbuild: false` in pnpm-workspace.yaml declines esbuild's
      # postinstall, which only links the prebuilt binary pnpm has already
      # unpacked from the platform's optional package; `vite build` below is
      # what proves the binary is found without it.
      - run: pnpm install --frozen-lockfile

      - name: typecheck (src and scripts)
        run: pnpm typecheck

      - name: input
        run: pnpm input
      - name: chat
        run: pnpm chat

      - name: world
        run: pnpm check
      - name: perf
        run: pnpm perf
      - name: traffic
        run: pnpm traffic
      - name: scenery
        run: pnpm scenery
      - name: people
        run: pnpm people
      - name: life
        run: pnpm life
      - name: fauna
        run: pnpm fauna
      - name: system
        run: pnpm system
      - name: solids
        run: pnpm solids
      - name: interiors
        run: pnpm interiors
      - name: fleet
        run: pnpm fleet
      - name: sky
        run: pnpm sky
      - name: railway
        run: pnpm railway
      - name: ground
        run: pnpm ground
      - name: country
        run: pnpm country
      - name: craft
        run: pnpm craft
      - name: effects
        run: pnpm effects
      - name: weather
        run: pnpm weather
      - name: ambient
        run: pnpm ambient
      - name: sea
        run: pnpm sea
      - name: passport
        run: pnpm passport
      - name: music
        run: pnpm music

      - name: build
        run: pnpm exec vite build

      - name: browser (driver and UI)
        run: pnpm shot && pnpm ui

      # The whole world booted in software rendering on a shared runner: it has
      # run out of its 90 seconds on a run with nothing wrong, so it reports
      # without failing the job. Run `pnpm graphics` locally for the verdict.
      - name: WebGL
        run: pnpm graphics
        continue-on-error: true

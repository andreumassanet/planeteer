<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>planeteer · menu</title>
    <style>
      :root {
        --ink: #1e0603;
        --card: #fff2e8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #6fc9d8; }
      body {
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      canvas { display: block; }
      .card {
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 12px;
        box-shadow: 0 5px 0 var(--ink);
        padding: 10px 20px;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #6fc9d8;
        text-align: center;
      }
      #loading .card { padding: 18px 32px; }
      #loading-title { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
      #loading-stage { font-size: 13px; font-weight: 600; opacity: 0.65; margin-top: 2px; }
      /* The sheet stands in for `index.html`, so it carries the same credit:
         GeoNames is CC BY 4.0 and the licence asks for it wherever a player sees
         the data. */
      #loading-credit { font-size: 11px; font-weight: 600; opacity: 0.45; margin-top: 12px; line-height: 1.5; }
      #loading-credit a { color: inherit; }
      #spawned {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 17px;
        font-weight: 800;
      }
      #spawned[hidden] { display: none; }
      #spawned small { display: block; font-size: 12px; font-weight: 600; opacity: 0.6; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="card">
        <div id="loading-title">planeteer</div>
        <div id="loading-stage">starting up</div>
        <div id="loading-credit">
          coastlines from <a href="https://www.naturalearthdata.com/">Natural Earth</a><br />
          towns from <a href="https://www.geonames.org/">GeoNames</a>,
          <a href="https://creativecommons.org/licenses/by/4.0/">CC&nbsp;BY&nbsp;4.0</a>
        </div>
      </div>
    </div>
    <div id="spawned" class="card" hidden></div>
    <script type="module" src="/src/sheets/menu.ts"></script>
  </body>
</html>

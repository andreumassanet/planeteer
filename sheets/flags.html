<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas · flags</title>
    <style>
      :root {
        --ink: #1e0603;
        --card: #fff2e8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: #c6b6cf;
        padding: 28px;
      }
      h1 { font-size: 24px; letter-spacing: -0.02em; }
      header {
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 12px;
        box-shadow: 0 5px 0 var(--ink);
        padding: 14px 20px;
        margin-bottom: 26px;
        display: flex;
        gap: 22px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      header b { font-size: 15px; }
      header span { font-size: 13px; font-weight: 600; opacity: 0.75; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 16px;
      }
      figure {
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 12px;
        box-shadow: 0 5px 0 var(--ink);
        padding: 10px;
      }
      figure canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 2px solid var(--ink);
        border-radius: 5px;
      }
      figcaption {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
      }
      figcaption em {
        display: block;
        font-style: normal;
        font-weight: 600;
        font-size: 10.5px;
        opacity: 0.6;
        letter-spacing: 0.04em;
      }
      .tag {
        display: inline-block;
        margin-top: 5px;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 2px solid var(--ink);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .tag.simplified { background: #f8a658; }
      .tag.none { background: #c8c2c1; }
    </style>
  </head>
  <body>
    <header id="summary"><b>loading…</b></header>
    <div class="grid" id="grid"></div>
    <script type="module" src="/src/sheets/flags.ts"></script>
  </body>
</html>

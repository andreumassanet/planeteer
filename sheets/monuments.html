<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atlas · monuments</title>
    <style>
      :root {
        --ink: #1e0603;
        --card: #fff2e8;
        --sky: #6fc9d8;
        --bad: #c30e3a;
        --warn: #e56202;
        --dim: rgba(30, 6, 3, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: var(--sky); }
      body {
        min-height: 100%;
        font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        padding: 0 20px 60px;
      }
      canvas { display: block; }

      /* The whole sheet is drawn into one canvas, scissored per cell. A canvas
         each would mean a WebGL context each, and browsers cap those at about
         sixteen — this has to survive a hundred monuments. */
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      header, #grid, #empty { position: relative; z-index: 1; }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin: 0 -20px 22px;
        padding: 14px 20px;
        background: var(--card);
        border-bottom: 3px solid var(--ink);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 18px;
      }
      h1 {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin-right: 4px;
      }
      h1 small { font-weight: 600; color: var(--dim); font-size: 12px; }
      .totals { font-size: 12.5px; font-weight: 700; color: var(--dim); }
      .totals b { color: var(--ink); }
      .grow { flex: 1; }

      label.control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 700;
        user-select: none;
        cursor: pointer;
      }
      input[type="search"] {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 5px 10px;
        width: 190px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: #fff;
        color: inherit;
      }
      input[type="checkbox"] { width: 15px; height: 15px; accent-color: #ec3f1c; }

      #notices {
        position: relative;
        z-index: 1;
        margin-bottom: 18px;
        display: grid;
        gap: 6px;
      }
      .notice {
        background: var(--bad);
        color: var(--card);
        border: 3px solid var(--ink);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
        gap: 18px;
      }
      .cell {
        /* No background: the stage is a hole through the card down to the
           shared canvas, and an opaque cell would cover it. The caption below
           carries the paper instead. */
        background: transparent;
        border: 3px solid var(--ink);
        border-radius: 12px;
        box-shadow: 0 5px 0 var(--ink);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .cell.broken { border-color: var(--bad); box-shadow: 0 5px 0 var(--bad); }
      /* Amber: valid, but something in it is buried or standing on nothing. */
      .cell.flawed { border-color: var(--warn); box-shadow: 0 5px 0 var(--warn); }
      .cell.flawed .stage { border-bottom-color: var(--warn); }
      .stage {
        /* Transparent on purpose: the shared canvas underneath shows through
           exactly here, which is what makes one context serve every cell. */
        height: 260px;
        border-bottom: 3px solid var(--ink);
        background: transparent;
      }
      .cell.broken .stage { border-bottom-color: var(--bad); }
      .caption { padding: 9px 12px 11px; background: var(--card); }
      .title { display: flex; align-items: baseline; gap: 7px; }
      .name { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
      .tier {
        font-size: 10.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 7px;
        border-radius: 20px;
        border: 2px solid var(--ink);
      }
      .tier.monument { background: #f8a658; }
      .tier.building { background: #91ad78; }
      .tier.tower { background: #3dbbe7; }
      .tier.landmark { background: #ed719f; }
      .meta {
        margin-top: 3px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }
      .stats {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 11.5px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stats span.over { color: var(--bad); }
      .stats i { font-style: normal; color: var(--dim); font-weight: 600; }
      .swatches { margin-top: 7px; display: flex; gap: 4px; }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 2px solid var(--ink);
      }
      .flaws {
        margin-top: 8px;
        padding-left: 15px;
        color: var(--warn);
        font-size: 11px;
        font-weight: 600;
        line-height: 1.45;
      }
      .flaws b { text-transform: uppercase; letter-spacing: 0.03em; font-size: 10px; }
      .problems {
        margin-top: 8px;
        padding-left: 15px;
        color: var(--bad);
        font-size: 11.5px;
        font-weight: 700;
        line-height: 1.45;
      }
      #empty {
        padding: 40px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--dim);
      }
      #empty[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <header>
      <h1>monument contact sheet <small>atlas</small></h1>
      <div class="totals" id="totals"></div>
      <div class="grow"></div>
      <input id="filter" type="search" placeholder="filter by name, id or iso" />
      <label class="control"><input id="broken" type="checkbox" /> problems only</label>
      <label class="control"><input id="flawed" type="checkbox" /> buried / floating</label>
      <label class="control"><input id="front" type="checkbox" /> front view (+Z)</label>
      <label class="control"><input id="spin" type="checkbox" /> turntable</label>
    </header>
    <div id="notices"></div>
    <main id="grid"></main>
    <div id="empty" hidden>nothing matches that filter.</div>
    <script type="module" src="/src/sheets/monuments.ts"></script>
  </body>
</html>

    <style>
      /*
       * Nunito, the one face of every card and label, carried rather than asked of
       * the system: a rounded face was always the intent, and only a Mac had one
       * (`SF Pro Rounded`); Linux drew Noto Sans and Windows Segoe UI. One variable
       * file a script, fetched only when a page shows a character in its range.
       */
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/fonts/nunito-cyrillic-ext.woff2') format('woff2-variations');
        unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/fonts/nunito-cyrillic.woff2') format('woff2-variations');
        unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/fonts/nunito-vietnamese.woff2') format('woff2-variations');
        unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/fonts/nunito-latin-ext.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-display: swap;
        font-weight: 200 1000;
        src: url('/fonts/nunito-latin.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
      }
      /*
       * The tokens, restated once for the loading screen: it has to paint before
       * `src/ui.ts` has been fetched, and `ui.ts` is the one definition of them
       * everywhere else.
       */
      :root {
        --ui-ink: #1e0603;
        --ui-paper: #fff2e8;
        --ui-cream: #fde6e1;
        --ui-gold: #e4a90c;
        --ui-font: Nunito, ui-rounded, "SF Pro Rounded", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #04060e; }
      body {
        font-family: var(--ui-font);
        color: var(--ui-ink);
        -webkit-font-smoothing: antialiased;
      }
      canvas { display: block; }
      #minimap {
        position: fixed;
        top: 24px;
        right: 24px;
        /* Pointer lock is requested by clicking the canvas underneath. Without
           this the minimap swallows the click and mouse look never engages. */
        pointer-events: none;
      }

      /*
       * The loading screen. **Every animation on it is a transform or an
       * opacity, and that is the whole design constraint**: building the land
       * is several seconds of synchronous work on the main thread, and only
       * the compositor keeps running through it. So the globe turns, the plane
       * circles and the clouds drift while the page is otherwise frozen, and
       * the progress bar moves because `main.ts` hands it a target and a
       * duration and lets a CSS transition run there — see `stage()`.
       */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(180deg, #04060e 0%, #0d1430 26%, #26336a 52%, #4a5c96 68%, #c98f86 86%, #f8a658 100%);
        transition: opacity 0.8s ease 0.1s, visibility 0.9s;
      }
      #loading.out { opacity: 0; visibility: hidden; }
      #loading.out .l-center { transform: scale(1.12); opacity: 0; }
      .l-stars, .l-stars::after {
        position: absolute;
        inset: 0 0 35% 0;
        background-image:
          radial-gradient(1.6px 1.6px at 12% 18%, #fff2e8 99%, transparent),
          radial-gradient(1.2px 1.2px at 27% 42%, #fff2e8 99%, transparent),
          radial-gradient(2px 2px at 41% 11%, #fde6e1 99%, transparent),
          radial-gradient(1.2px 1.2px at 58% 31%, #fff2e8 99%, transparent),
          radial-gradient(1.8px 1.8px at 73% 16%, #fff2e8 99%, transparent),
          radial-gradient(1.2px 1.2px at 86% 38%, #fde6e1 99%, transparent),
          radial-gradient(1.6px 1.6px at 93% 9%, #fff2e8 99%, transparent),
          radial-gradient(1.2px 1.2px at 6% 52%, #fff2e8 99%, transparent),
          radial-gradient(1.4px 1.4px at 66% 55%, #fff2e8 99%, transparent),
          radial-gradient(1.2px 1.2px at 34% 64%, #fde6e1 99%, transparent);
        content: '';
      }
      .l-stars::after {
        background-position: 3% 7%;
        opacity: 0.6;
        animation: l-twinkle 3.2s ease-in-out infinite alternate;
      }
      .l-center {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: transform 0.9s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.6s ease;
      }
      .l-world { position: relative; width: 176px; height: 176px; }
      .l-glow {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(248, 166, 88, 0.36) 0%, rgba(248, 166, 88, 0) 65%);
      }
      .l-globe {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: #2b7fa8;
        border: 5px solid var(--ui-ink);
        box-shadow: 0 9px 0 var(--ui-ink);
        /* Safari clips an animated child of a rounded box only with this. */
        isolation: isolate;
      }
      .l-strip {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 672px;
        display: flex;
        will-change: transform;
      }
      .l-strip svg { flex: none; width: 336px; height: 100%; }
      .l-land { animation: l-turn 26s linear infinite; }
      .l-weather { animation: l-turn 17s linear infinite; opacity: 0.92; }
      .l-shade {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        /* A cel terminator, not a gradient: a hard-edged inner shadow is the
           one band of night this style would draw on a planet. */
        box-shadow: inset -30px -16px 0 rgba(13, 20, 48, 0.42), inset 9px 8px 0 rgba(255, 242, 232, 0.2);
      }
      .l-orbit {
        position: absolute;
        inset: -42px;
        border-radius: 50%;
        border: 2.5px dashed rgba(255, 242, 232, 0.32);
        animation: l-spin 6.5s linear infinite;
      }
      .l-plane {
        position: absolute;
        top: -17px;
        left: 50%;
        width: 34px;
        height: 34px;
        margin-left: -17px;
      }
      .l-title {
        margin-top: 44px;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 0.9;
        color: var(--ui-paper);
        -webkit-text-stroke: 8px var(--ui-ink);
        paint-order: stroke fill;
        text-shadow: 0 8px 0 var(--ui-ink);
      }
      .l-tag {
        margin-top: 16px;
        font-size: 16px;
        font-weight: 700;
        color: rgba(255, 242, 232, 0.86);
        text-shadow: 0 2px 0 rgba(4, 6, 14, 0.55);
      }
      .l-progress { margin-top: 34px; width: 320px; }
      .l-bar {
        position: relative;
        height: 22px;
        overflow: hidden;
        border: 3px solid var(--ui-ink);
        border-radius: 999px;
        background: var(--ui-paper);
        box-shadow: 0 4px 0 var(--ui-ink);
      }
      /* The fill is a full-width bar slid in from the left, so its stripes are
         never squashed the way a scaled bar's would be. */
      #loading-fill {
        position: absolute;
        inset: 0;
        background: var(--ui-gold);
        border-right: 3px solid var(--ui-ink);
        transform: translateX(-100%);
        transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.3, 1);
        overflow: hidden;
      }
      #loading-fill i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40px;
        right: 0;
        background: repeating-linear-gradient(-45deg, rgba(255, 242, 232, 0) 0 9px, rgba(255, 242, 232, 0.34) 9px 18px);
        animation: l-stripes 0.8s linear infinite;
      }
      .l-status {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-size: 13px;
        font-weight: 700;
        color: rgba(255, 242, 232, 0.82);
      }
      #loading-percent { font-variant-numeric: tabular-nums; color: var(--ui-paper); font-weight: 800; }
      /* GeoNames is CC BY 4.0 and the licence asks for a credit somewhere a
         player sees it. This is that place, and the settings panel is the other.
         The star catalogue is the CDS's to hand out on the same condition, an
         acknowledgement. Natural Earth is public domain and is named for good
         manners. */
      .l-credit {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 22px;
        font-size: 11.5px;
        font-weight: 600;
        text-align: center;
        color: rgba(30, 6, 3, 0.62);
      }
      .l-credit a { color: inherit; }
      @keyframes l-turn { to { transform: translateX(-336px); } }
      @keyframes l-spin { to { transform: rotate(360deg); } }
      @keyframes l-stripes { to { transform: translateX(25.5px); } }
      @keyframes l-twinkle { from { opacity: 0.15; } to { opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) {
        .l-land, .l-weather, .l-orbit, #loading-fill i, .l-stars::after { animation: none; }
      }
      @media (max-width: 520px) {
        .l-title { font-size: 64px; }
        .l-progress { width: 260px; }
      }

      /*
       * The notice: a card over everything, for what the player has to be told
       * before or instead of the world — no WebGL 2, a small or touch screen, a lost
       * context, a failure (`notice` in `main.ts`). It is here and not in
       * `ui.ts` for the reason the tokens above are: the first two are said
       * before anything is downloaded, and the last may be a download that
       * failed. It restates the card and the button of `ui.ts`, and nothing
       * else may.
       */
      #notice {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(4, 6, 14, 0.55);
        font-family: var(--ui-font);
        color: var(--ui-ink);
      }
      #notice[hidden] { display: none; }
      .n-card {
        width: min(440px, 100%);
        padding: 22px 24px 20px;
        background: var(--ui-paper);
        border: 3px solid var(--ui-ink);
        border-radius: 14px;
        box-shadow: 0 5px 0 var(--ui-ink);
      }
      .n-eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; }
      .n-title { margin-top: 4px; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
      .n-text { margin-top: 8px; font-size: 14px; font-weight: 600; line-height: 1.45; opacity: 0.72; overflow-wrap: anywhere; }
      .n-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .n-btn {
        font: 800 15px/1 var(--ui-font);
        color: var(--ui-ink);
        background: var(--ui-paper);
        border: 3px solid var(--ui-ink);
        border-radius: 11px;
        box-shadow: 0 4px 0 var(--ui-ink);
        padding: 11px 18px;
        cursor: pointer;
        transition: transform 0.09s ease, box-shadow 0.09s ease;
      }
      .n-btn.primary { background: var(--ui-gold); }
      .n-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ui-ink); }
      .n-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ui-ink); }
      .n-btn:focus-visible { outline: 3px solid var(--ui-paper); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        .n-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="minimap"></div>

      <div class="l-center">

              </svg>
              <svg viewBox="0 0 400 200" preserveAspectRatio="none">
                <g stroke="#1e0603" stroke-width="3.2" stroke-linejoin="round">
                  <path fill="#a49876" d="M36 44c22-18 70-22 88 0 8 12-6 22-16 32-9 9-15 19-22 30-12-7-19-17-27-27-11-9-28-22-23-35z"/>
                  <path fill="#fde6e1" d="M136 22c12-8 30-7 30 5-4 10-20 11-29 3z"/>

            </div>
            <div class="l-strip l-weather">

        <h1 class="l-title">planeteer</h1>
        <p class="l-tag">Explore the solar system — on foot, by sea and by air.</p>
        <div class="l-progress">

    <div id="notice" role="alertdialog" aria-modal="true" aria-labelledby="notice-title" aria-describedby="notice-text" hidden>
      <div class="n-card">
        <div class="n-eyebrow">planeteer</div>
        <h2 class="n-title" id="notice-title"></h2>
        <p class="n-text" id="notice-text"></p>
        <div class="n-actions" id="notice-actions"></div>

    <script type="module" src="/src/main.ts"></script>
